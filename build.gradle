plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()

    mods {
        "connectomefly" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // Automated client test: joins run/saves/devworld, spawns flies, screenshots, exits.
        autoTest {
            client()
            name = 'Auto Test'
            programArgs '--quickPlaySingleplayer', 'devworld'
            vmArg "-Dflygenetics.autotest=${project.findProperty('autotest') ?: 'true'}"
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.compilerArgs += ['-Xmaxerrs', '5000'] }


// prints the compile classpath, for headless tools
tasks.register('printClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast { println 'CLASSPATH=' + cp.asPath }
}
